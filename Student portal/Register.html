<!DOCTYPE html>
<html>
<head>
  <title>StudentHub - Register</title>
</head>
<body>
<div>
  <h1><u>Student Registration</u></h1>
  <hr>
  <form id="registerForm">
    <table>
      <tr>
        <td><b>Full Name :</b></td>
        <td><input type="text" id="fullName" size="30" required></td>
      </tr>
      <tr>
        <td><b>Student ID :</b></td>
        <td><input type="text" id="studentId" size="30" required></td>
      </tr>
      <tr>
        <td><b>Email :</b></td>
        <td><input type="email" id="email" size="30" required></td>
      </tr>
      <tr>
        <td><b>Phone :</b></td>
        <td><input type="text" id="phone" size="30" required></td>
      </tr>
      <tr>
        <td><b>Department :</b></td>
        <td>
          <select id="department">
            <option>Computer Engineering</option>
            <option>Information Technology</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
            <option>Electrical Engineering</option>
          </select>
        </td>
      </tr>
      <tr>
        <td><b>Semester :</b></td>
        <td>
          <select id="semester">
            <option>1st</option>
            <option>2nd</option>
            <option>3rd</option>
            <option>4th</option>
            <option>5th</option>
            <option>6th</option>
            <option>7th</option>
            <option>8th</option>
          </select>
        </td>
      </tr>
      <tr>
        <td><b>Password :</b></td>
        <td><input type="password" id="password" size="30" required></td>
      </tr>
      <tr>
        <td><b>Confirm Password :</b></td>
        <td><input type="password" id="confirm" size="30" required></td>
      </tr>
      <tr>
        <td></td>
        <td><input type="submit" value="Register"></td>
      </tr>
      <tr>
        <td></td>
        <td><a href="login.html">Already have an account? Login</a></td>
      </tr>
    </table>
  </form>
</div>

<script src="auth.js"></script>
</body>
</html>
