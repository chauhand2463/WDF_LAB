<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <h1>Registration Form</h1>

    <form id="registrationForm" onsubmit="return validateRegistration()" onreset="clearErrors()">

        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname">
        <span id="fnameError"></span>
        <br><br>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname">
        <span id="lnameError"></span>
        <br><br>

        <label for="contact">Contact Number:</label>
        <input type="text" id="contact" name="contact" maxlength="10">
        <span id="contactError"></span>
        <br><br>

        <label for="email">Email Address:</label>
        <input type="text" id="email" name="email">
        <span id="emailError"></span>
        <br><br>

        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <span id="genderError"></span>
        <br><br>

        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4" cols="30"></textarea>
        <span id="addressError"></span>
        <br><br>

        <label for="city">City:</label>
        <input type="text" id="city" name="city">
        <span id="cityError"></span>
        <br><br>

        <label for="state">State:</label>
        <input type="text" id="state" name="state">
        <span id="stateError"></span>
        <br><br>

        <label for="country">Country:</label>
        <input type="text" id="country" name="country">
        <span id="countryError"></span>
        <br><br>

        <label for="pincode">Pincode:</label>
        <input type="text" id="pincode" name="pincode" maxlength="6">
        <span id="pincodeError"></span>
        <br><br>

        <label for="image">Upload Image:</label>
        <input type="file" id="image" name="image" accept=".jpg,.jpeg,.png">
        <span id="imageError"></span>
        <br>

        <small>Maximum image size: 20 KB</small>

        <br><br>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>

    </form>

    <script src="registration.js"></script>

</body>
</html>
