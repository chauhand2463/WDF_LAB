<div>
  <h1><u>Student Registration</u></h1>
  <hr>
  <form>
    <table>
      <tr>
        <td><b>Full Name :</b></td>
        <td><input type="text" size="30" required></td>
      </tr>
      <tr>
        <td><b>Student ID :</b></td>
        <td><input type="text" size="30" required></td>
      </tr>
      <tr>
        <td><b>Email :</b></td>
        <td><input type="email" size="30" required></td>
      </tr>
      <tr>
        <td><b>Phone :</b></td>
        <td><input type="text" size="30" required></td>
      </tr>
      <tr>
        <td><b>Department :</b></td>
        <td>
          <select>
            <option>Computer Engineering</option>
            <option>Information Technology</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
            <option>Electrical Engineering</option>
          </select>
        </td>
      </tr>
      <tr>
        <td><b>Semester :</b></td>
        <td>
          <select>
            <option>1st</option>
            <option>2nd</option>
            <option>3rd</option>
            <option>4th</option>
            <option>5th</option>
            <option>6th</option>
            <option>7th</option>
            <option>8th</option>
          </select>
        </td>
      </tr>
      <tr>
        <td><b>Password :</b></td>
        <td><input type="password" size="30" required></td>
      </tr>
      <tr>
        <td><b>Confirm Password :</b></td>
        <td><input type="password" size="30" required></td>
      </tr>
      <tr>
        <td></td>
        <td><input type="submit" value="Register"> <input type="reset" value="Clear"></td>
      </tr>
      <tr>
        <td></td>
        <td><a href="login.html">Already have an account? Login</a></td>
      </tr>
    </table>
  </form>
</div>

</body>
