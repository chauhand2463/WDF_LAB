<!DOCTYPE html>
<html>
<head>
  <title>StudentHub - Forgot Password</title>
</head>
<body>

<h1>Forgot Password</h1>
<hr>
<p>Enter your Student ID and registered email to reset your password.</p>
<br>
<form>
  <b>Student ID :</b>
  <br>
  <input type="text" size="25" required>
  <br><br>
  <b>Email :</b>
  <br>
  <input type="email" size="25" required>
  <br><br>
  <b>New Password :</b>
  <br>
  <input type="password" size="25" required>
  <br><br>
  <b>Confirm Password :</b>
  <br>
  <input type="password" size="25" required>
  <br><br>
  <input type="submit" value="Reset Password"> <input type="reset" value="Clear">
  <br><br>
  <a href="login.html">Back to Login</a>
</form>

</body>
</html>
